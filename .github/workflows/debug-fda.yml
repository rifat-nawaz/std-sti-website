name: Debug FDA links (temporary)
on: workflow_dispatch
jobs:
  fda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            https://www.fda.gov/news-events/press-announcements/fda-grants-marketing-authorization-first-home-test-chlamydia-gonorrhea-and-trichomoniasis \
            https://www.fda.gov/news-events/press-announcements/fda-grants-marketing-authorization-first-test-chlamydia-and-gonorrhea-home-sample-collection \
            https://www.fda.gov/news-events/press-announcements/fda-marketing-authorization-enables-increased-access-first-step-syphilis-diagnosis ; do
            echo "== $u"
            curl -s -o /dev/null -w "live: %{http_code} -> %{url_effective}\n" -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" -H "Accept-Language: en-US" "$u"
            curl -s "https://archive.org/wayback/available?url=$u" ; echo
            curl -s "https://web.archive.org/cdx/search/cdx?url=$u&output=json&limit=-3&fl=timestamp,statuscode"; echo
          done
