name: Check links
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # every Monday
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-external-links.mjs
